name: "koine gate"
description: >-
  Fail CI when multilingual docs have silently drifted: stale translations,
  files edited outside the pipeline, broken audit chains, glossary violations.
branding:
  icon: "globe"
  color: "purple"

inputs:
  source:
    description: "Source document (e.g. README.md)"
    required: true
  translations:
    description: "Space-separated lang=path pairs (e.g. 'es=README.es.md ru=README.ru.md')"
    required: true
  koine-dir:
    description: "State directory"
    default: ".koine"
  forbid-machine-only:
    description: "Fail on unreviewed machine translations"
    default: "false"
  forbid-legacy:
    description: "Fail on adopted-but-unverified legacy pairs"
    default: "false"
  comment:
    description: "Post a drift report as a comment on the pull request"
    default: "false"
  github-token:
    description: >-
      Token used to post the PR comment when `comment` is true. Pass the
      workflow's github.token (or a PAT with pull-request write). Only needed
      for the comment; the gate itself needs no token.
    default: ""

runs:
  using: "composite"
  steps:
    - id: install
      shell: bash
      run: pip install --quiet -e ${{ github.action_path }}/.. || pip install --quiet koine

    # Report drift on the PR first, so the comment appears even when the gate
    # below fails the check. Slack/email fire too if their env vars are set on
    # the job. Never fails the build itself -- the gate owns pass/fail.
    - id: comment
      if: ${{ inputs.comment == 'true' }}
      shell: bash
      env:
        KOINE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        ARGS=""
        for t in ${{ inputs.translations }}; do ARGS="$ARGS --translation $t"; done
        python3 -m koine --koine-dir "${{ inputs.koine-dir }}" notify \
          --source "${{ inputs.source }}" $ARGS

    - id: gate
      shell: bash
      run: |
        ARGS=""
        for t in ${{ inputs.translations }}; do ARGS="$ARGS --translation $t"; done
        [ "${{ inputs.forbid-machine-only }}" = "true" ] && ARGS="$ARGS --forbid-machine-only"
        [ "${{ inputs.forbid-legacy }}" = "true" ] && ARGS="$ARGS --forbid-legacy"
        python3 -m koine --koine-dir "${{ inputs.koine-dir }}" gate \
          --source "${{ inputs.source }}" $ARGS
