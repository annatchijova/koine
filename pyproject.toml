[project]
name = "koine"
version = "0.1.0"
description = "Multilingual repos that cannot silently lie: hash-sealed translations, mechanical drift detection, and an agent fleet that proposes but never decides."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
agents = ["google-adk>=2.7,<3"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["koine", "koine.*"]

[tool.setuptools.package-data]
koine = ["architecture.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
